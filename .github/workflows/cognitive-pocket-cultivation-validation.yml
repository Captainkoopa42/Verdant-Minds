name: Cognitive Pocket Cultivation Research v0
on:
  push:
    branches:
      - test/cognitive-pocket-cultivation-v0
    paths:
      - "verdant_pockets/**"
      - "tests/test_cognitive_pocket_cultivation.py"
      - ".github/workflows/cognitive-pocket-cultivation-validation.yml"
  workflow_dispatch:
jobs:
  native-pocket-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile pocket code and tests
        run: python -m compileall -q verdant_pockets tests/test_cognitive_pocket_cultivation.py
      - name: Run native P/Q, obligation and pocket regressions
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -m pytest -q tests/test_cognitive_pocket_cultivation.py tests/test_hierarchy_phase.py tests/test_structure_interaction_phase.py tests/test_obligation_substrate.py tests/test_counterfactual_runtime.py
