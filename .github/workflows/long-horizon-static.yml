name: Long-Horizon Focused Checks (No Training Runs)

on:
  push:
    branches:
      - test/long-horizon-curriculum-v0
    paths:
      - "verdant_math/long_horizon_preflight/**"
      - "tests/test_long_horizon_preflight.py"
      - "tests/test_long_horizon_resume.py"
      - ".github/workflows/long-horizon-static.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile current experimental code
        run: |
          python -m compileall -q verdant_math/long_horizon_preflight tests/test_long_horizon_preflight.py tests/test_long_horizon_resume.py
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Execute focused persistence and interruption tests only
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest -q tests/test_long_horizon_preflight.py tests/test_long_horizon_resume.py
