name: Long-Horizon Static Checks (No Seed Runs)

on:
  push:
    branches:
      - test/long-horizon-curriculum-v0
    paths:
      - "verdant_math/long_horizon_preflight/**"
      - "tests/test_long_horizon_preflight.py"
      - ".github/workflows/long-horizon-static.yml"
  workflow_dispatch:

jobs:
  syntax-and-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify syntax only
        run: |
          python -m compileall -q verdant_math/long_horizon_preflight tests/test_long_horizon_preflight.py
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Collect focused tests without executing seeds
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest --collect-only -q tests/test_long_horizon_preflight.py
