name: Bounded Q Subfamilies Validation
on:
  workflow_dispatch:
jobs:
  focused-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Syntax check
        run: python -m compileall -q verdant_hierarchy verdant_integrated tests/test_q_subfamilies.py
      - name: Native interaction, hierarchy, curriculum and adversarial tests only
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -m pytest -q tests/test_q_subfamilies.py tests/test_hierarchy_phase.py tests/test_structure_interaction_phase.py tests/test_vast_integrated.py tests/test_structures_phase.py
