name: Structural Transfer Focused Validation

on:
  push:
    branches:
      - test/structural-transfer-v0
    paths:
      - "verdant_math/structural_transfer/**"
      - "tests/test_structural_transfer.py"
      - ".github/workflows/structural-transfer-tests.yml"
  workflow_dispatch:

jobs:
  test-native-structural-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Compile experimental code
        run: |
          python -m compileall -q verdant_math/structural_transfer tests/test_structural_transfer.py
      - name: Run only focused tests (no full curriculum or seeds)
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest -q tests/test_structural_transfer.py
