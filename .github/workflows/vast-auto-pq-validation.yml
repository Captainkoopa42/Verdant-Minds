name: Native P and Q Integration Validation

on:
  workflow_dispatch:

jobs:
  synthetic-smoke-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned requirements
        run: python -m pip install -r requirements-lock.txt
      - name: Syntax check
        run: python -m compileall -q verdant_integrated tests/test_vast_integrated.py
      - name: Focused synthetic tests only; never the operator 600-item curriculum
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -m pytest -q tests/test_vast_integrated.py tests/test_structures_phase.py tests/test_hierarchy_phase.py
