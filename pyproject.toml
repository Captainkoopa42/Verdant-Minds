[project]
name = "verdant-mind"
version = "0.4.0"
description = "Verdant Minds — Developmental Cognitive Kernel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "William R. Adams"}]
keywords = ["cognitive-architecture", "ecwf", "memoryweb", "developmental-ai"]

dependencies = [
    "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "torch>=2.0",
    "psutil>=5.9", "joblib>=1.3", "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]
robot = ["opencv-python", "pyserial"]

[project.scripts]
verdant = "verdant.cli:main"

[project.urls]
Homepage = "https://github.com/Captainkoopa42/Verdant-Minds"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["verdant"]
