[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdant-minds"
version = "0.1.0"
description = "A cognitive architecture for AI with quantum-inspired thermodynamic knowledge representation"
readme = "README.md"
authors = [
    {name = "captainkoopa42", email = "adamswilliam905@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = [
    "artificial-intelligence",
    "cognitive-architecture",
    "quantum-computing",
    "ethical-ai",
    "knowledge-representation",
    "thermodynamics",
    "emergent-behavior",
    "consciousness",
    "machine-learning",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "tensorflow>=2.13.0,<3.0.0",
    "torch>=2.0.0,<3.0.0",
    "networkx>=3.0,<4.0",
    "python-louvain>=0.16",
    "matplotlib>=3.7.0,<4.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "Werkzeug>=3.0.0,<4.0.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.7.0,<24.0.0",
    "flake8>=6.1.0,<7.0.0",
    "isort>=5.12.0,<6.0.0",
    "pylint>=3.0.0,<4.0.0",
    "mypy>=1.5.0,<2.0.0",
    "sphinx>=7.0.0,<8.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "ipython>=8.14.0,<9.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.0.0",
    "pdbpp>=0.10.3",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pre-commit>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/captainkoopa42/Verdant-Minds"
Documentation = "https://github.com/captainkoopa42/Verdant-Minds#readme"
Repository = "https://github.com/captainkoopa42/Verdant-Minds"
"Bug Tracker" = "https://github.com/captainkoopa42/Verdant-Minds/issues"

[project.scripts]
verdant-minds = "usm.__main__:main"
usm = "usm.__main__:main"

[tool.setuptools]
packages = ["usm"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["Verdant Source Codes/src/**/*.py"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["usm"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
