[metadata]
name = verdant-minds
version = 0.1.0
author = captainkoopa42
author_email = adamswilliam905@gmail.com
description = A cognitive architecture for AI with quantum-inspired thermodynamic knowledge representation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/captainkoopa42/Verdant-Minds
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Intended Audience :: Developers
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Physics
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.24.0,<2.0.0
    tensorflow>=2.13.0,<3.0.0
    torch>=2.0.0,<3.0.0
    networkx>=3.0,<4.0
    python-louvain>=0.16
    matplotlib>=3.7.0,<4.0.0
    PyJWT>=2.8.0,<3.0.0
    Werkzeug>=3.0.0,<4.0.0
include_package_data = True
zip_safe = False

[options.packages.find]
include = usm, usm.*
exclude = tests, tests.*, docs, docs.*

[options.entry_points]
console_scripts =
    verdant-minds = usm.__main__:main
    usm = usm.__main__:main

[options.extras_require]
dev =
    pytest>=7.4.0,<8.0.0
    pytest-cov>=4.1.0
    black>=23.7.0,<24.0.0
    flake8>=6.1.0,<7.0.0
    mypy>=1.5.0,<2.0.0
    ipython>=8.14.0,<9.0.0

[bdist_wheel]
universal = 0

[flake8]
max-line-length = 100
extend-ignore = E203, E501, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    venv

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
