[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdant_v2"
version = "0.1.0"
description = "Verdant v2 cognitive architecture"
requires-python = ">=3.10"
dependencies = [
    "ethomorphic",
    "networkx>=3.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["verdant_v2*"]
